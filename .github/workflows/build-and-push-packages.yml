name: Build and publish packages

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  build-and-publish-deb:
    name: Build and publish Debian packages
    runs-on: ubuntu-latest
    container:
      image: node:24-trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            librsvg2-bin \
            debhelper-compat \
            dpkg-dev \
            make

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build Debian packages
        run: make deb

      - name: Upload packages to Gitea registry
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
        run: |
          : "${REGISTRY_TOKEN:?Set the REGISTRY_TOKEN repository or organization secret}"
          for release in trixie forky sid; do
            for package in ../*.deb; do
              [ -f "$package" ] || {
                echo "No Debian package found at $package" >&2
                exit 1
              }
              curl --fail --show-error --silent \
                -u "${REGISTRY_OWNER}:${REGISTRY_TOKEN}" \
                -T "$package" \
                "${GITEA_SERVER_URL}/api/packages/${REGISTRY_OWNER}/debian/pool/${release}/main/upload"
            done
          done

  build-and-publish-rpm:
    name: Build and publish RPM packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            make \
            nodejs \
            librsvg2-tools \
            rpm-build
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build RPM packages
        run: make rpm

      - name: Upload packages to Gitea registry
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
        run: |
          : "${REGISTRY_TOKEN:?Set the REGISTRY_TOKEN repository or organization secret}"
          for package in dist/*.rpm; do
            [ -f "$package" ] || {
              echo "No RPM package found at $package" >&2
              exit 1
            }
            curl --fail --show-error --silent \
              -u "${REGISTRY_OWNER}:${REGISTRY_TOKEN}" \
              -T "$package" \
              "${GITEA_SERVER_URL}/api/packages/${REGISTRY_OWNER}/rpm/upload"
          done

  build-and-publish-arch:
    name: Build and publish Arch Linux packages
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch package build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            nodejs \
            librsvg \
            make

      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build Arch Linux packages
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- make apk

      - name: Publish Arch Linux packages to Gitea
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          GITEA_SERVER_URL: ${{ github.server_url }}
        run: |
          : "${REGISTRY_TOKEN:?Set the REGISTRY_TOKEN repository or organization secret}"
          for package in ./*.pkg.tar.zst; do
            [ -f "$package" ] || {
              echo "No Arch package found at $package" >&2
              exit 1
            }
            curl --fail --show-error --silent \
              -u "${REGISTRY_OWNER}:${REGISTRY_TOKEN}" \
              -T "$package" \
              "${GITEA_SERVER_URL}/api/packages/${REGISTRY_OWNER}/arch/stable/$(basename "$package")"
          done
